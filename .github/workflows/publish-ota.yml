name: Publish OTA Firmware

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Versao do firmware (ex: 1.2.5)'
        required: true
      greenhouse_id:
        description: 'ID da estufa (ex: IFUNGI-EC:62:60:99:E7:0C)'
        required: true
      firmware_url:
        description: 'URL direta do .bin para download'
        required: true
      release_repo:
        description: 'Repositorio de releases (usuario/repo)'
        required: true
        default: 'viniciusmerlak/IFUNGI-OTA-UPDATES'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Validar versao
        run: |
          if ! echo "${{ inputs.version }}" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Versao invalida: ${{ inputs.version }}. Use formato X.Y.Z"
            exit 1
          fi

      - name: Download do firmware
        run: |
          echo "Baixando firmware de: ${{ inputs.firmware_url }}"
          curl -L -f -o firmware.bin "${{ inputs.firmware_url }}"
          SIZE=$(stat -c%s firmware.bin)
          echo "Tamanho: ${SIZE} bytes"
          if [ "$SIZE" -lt 10000 ]; then
            echo "Arquivo muito pequeno — possivel erro no download"
            exit 1
          fi
          # Valida magic byte do ESP32 (0xE9)
          MAGIC=$(xxd -l 1 firmware.bin | awk '{print $2}')
          if [ "$MAGIC" != "e9" ]; then
            echo "Magic byte invalido: $MAGIC (esperado: e9). Arquivo nao e um firmware ESP32 valido."
            exit 1
          fi
          echo "Firmware valido (magic byte OK)"

      - name: Renomear para firmware.bin com versao
        run: |
          cp firmware.bin "firmware-v${{ inputs.version }}.bin"

      - name: Criar release no GitHub
        id: create_release
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.OTA_GITHUB_TOKEN }}
          script: |
            const [owner, repo] = '${{ inputs.release_repo }}'.split('/')
            const tag = 'v${{ inputs.version }}'

            // Verifica se a tag ja existe
            try {
              await github.rest.repos.getReleaseByTag({ owner, repo, tag })
              core.setFailed(`Release ${tag} ja existe. Use outra versao.`)
              return
            } catch (e) {
              if (e.status !== 404) throw e
            }

            const release = await github.rest.repos.createRelease({
              owner,
              repo,
              tag_name: tag,
              name: `IFungi Firmware ${tag}`,
              body: [
                `## IFungi Greenhouse Firmware ${tag}`,
                '',
                `**Estufa:** \`${{ inputs.greenhouse_id }}\``,
                `**Data:** ${new Date().toISOString()}`,
                '',
                '### Instalação',
                'Esta release foi publicada automaticamente pelo GitHub Actions.',
                'O ESP32 receberá a atualização via OTA automaticamente.',
              ].join('\n'),
              draft: false,
              prerelease: false,
            })

            core.setOutput('upload_url', release.data.upload_url)
            core.setOutput('release_id', release.data.id)
            console.log(`Release criada: ${release.data.html_url}`)

      - name: Upload do firmware no release
        id: upload_asset
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.OTA_GITHUB_TOKEN }}
          script: |
            const fs = require('fs')
            const [owner, repo] = '${{ inputs.release_repo }}'.split('/')
            const releaseId = '${{ steps.create_release.outputs.release_id }}'
            const fileName = 'firmware-v${{ inputs.version }}.bin'
            const fileContent = fs.readFileSync(fileName)

            const asset = await github.rest.repos.uploadReleaseAsset({
              owner,
              repo,
              release_id: releaseId,
              name: 'firmware.bin',
              data: fileContent,
              headers: {
                'content-type': 'application/octet-stream',
                'content-length': fileContent.length,
              },
            })

            const downloadUrl = asset.data.browser_download_url
            core.setOutput('download_url', downloadUrl)
            console.log(`Asset publicado: ${downloadUrl}`)

      - name: Atualizar Firebase RTDB via REST
        run: |
          DOWNLOAD_URL="${{ steps.upload_asset.outputs.download_url }}"
          GREENHOUSE_ID="${{ inputs.greenhouse_id }}"
          VERSION="${{ inputs.version }}"
          TIMESTAMP=$(date +%s)

          # Monta o payload JSON
          PAYLOAD=$(cat <<EOF
          {
            "available": true,
            "version": "${VERSION}",
            "url": "${DOWNLOAD_URL}",
            "notes": "Publicado via GitHub Actions em $(date -u '+%Y-%m-%dT%H:%M:%SZ')",
            "lastPublishedAt": ${TIMESTAMP}
          }
          EOF
          )

          # Escreve no Firebase via REST API (PATCH para não sobrescrever lastInstalledVersion)
          HTTP_STATUS=$(curl -s -o /tmp/firebase_response.json -w "%{http_code}" \
            -X PATCH \
            -H "Content-Type: application/json" \
            -d "${PAYLOAD}" \
            "${{ secrets.FIREBASE_DATABASE_URL }}/greenhouses/${GREENHOUSE_ID}/ota.json?auth=${{ secrets.FIREBASE_DB_SECRET }}")

          echo "Firebase HTTP status: ${HTTP_STATUS}"
          cat /tmp/firebase_response.json

          if [ "${HTTP_STATUS}" != "200" ]; then
            echo "Falha ao escrever no Firebase (status ${HTTP_STATUS})"
            exit 1
          fi

          echo "OTA registrado no Firebase com sucesso"

      - name: Resumo da publicacao
        run: |
          echo "## ✅ OTA Publicado com Sucesso" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Campo | Valor |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Versão** | v${{ inputs.version }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Estufa** | \`${{ inputs.greenhouse_id }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Download URL** | ${{ steps.upload_asset.outputs.download_url }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Repositório** | ${{ inputs.release_repo }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "O ESP32 vai detectar a atualização no próximo ciclo de verificação (≤60s)." >> $GITHUB_STEP_SUMMARY
